[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-vqa"
version = "0.1.0"
description = "Reliability-Aware Temporal Evidence for AIGC Video Quality Assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.57.0,<6",
  "peft>=0.14",
  "accelerate>=1.2",
  "av>=13.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "safetensors>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

